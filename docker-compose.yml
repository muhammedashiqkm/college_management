services:
  web:
    build: .
    container_name: course-recommendation
    volumes:
      - .:/app 
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: "redis:alpine"
    container_name: course-redis
    volumes:
      - redis_data:/data 

volumes:
  redis_data:
